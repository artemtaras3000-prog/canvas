<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pixel Point ❤️ Миша</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: #0a0a1a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Верхняя панель */
        .pixel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.8);
            padding: 8px 15px;
            flex-wrap: wrap;
            gap: 10px;
            z-index: 10;
        }

        .event-badge {
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            padding: 8px 15px;
            border-radius: 30px;
            font-weight: bold;
            color: white;
            font-size: 0.9rem;
        }

        .pixel-stats {
            background: #16213e;
            padding: 8px 15px;
            border-radius: 30px;
            font-size: 0.9rem;
            color: #ffcc00;
            font-family: monospace;
        }

        .clear-btn {
            background: #f44336;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
        }

        .clear-btn:hover {
            background: #d32f2f;
        }

        /* Холст */
        .pixel-canvas-container {
            flex: 1;
            background: #0f0f1a;
            border: 3px solid #00ff88;
            margin: 5px 10px 10px 10px;
            border-radius: 15px;
            overflow: auto;
            cursor: crosshair;
            position: relative;
        }

        #pixel-canvas {
            background: white;
            display: block;
            margin: 0 auto;
        }

        /* Палитра цветов */
        .pixel-controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 8px;
            flex-wrap: wrap;
            background: rgba(0,0,0,0.5);
        }

        .pixel-color-palette {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            background: rgba(0,0,0,0.7);
            padding: 8px;
            border-radius: 40px;
        }

        .pixel-color-btn {
            width: 35px;
            height: 35px;
            border-radius: 8px;
            cursor: pointer;
            border: 2px solid white;
            transition: transform 0.1s;
        }

        .pixel-color-btn.active {
            border: 3px solid #00ff88;
            transform: scale(1.1);
        }

        /* ВСПЛЫВАЮЩАЯ ТАБЛИЧКА "Миша, я люблю тебя!" */
        .love-popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            color: white;
            padding: 30px 50px;
            border-radius: 30px;
            font-size: 2.5rem;
            font-weight: bold;
            box-shadow: 0 0 50px rgba(255, 107, 107, 0.8);
            z-index: 10000;
            display: none;
            text-align: center;
            animation: popIn 0.3s ease;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            border: 3px solid white;
        }

        .love-popup .sub {
            font-size: 1.2rem;
            opacity: 0.8;
            margin-top: 5px;
        }

        @keyframes popIn {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }

        @keyframes popOut {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
        }

        /* Онлайн-счётчик */
        .online-counter {
            position: fixed;
            bottom: 10px;
            left: 10px;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(5px);
            padding: 5px 12px;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: bold;
            color: #00ffcc;
            font-family: monospace;
            z-index: 1000;
            pointer-events: none;
        }
    </style>
</head>
<body>

<div class="online-counter">👥 Онлайн: <span id="onlineCount">0</span></div>

<!-- Всплывающая табличка -->
<div id="lovePopup" class="love-popup">
    ❤️ Миша, я люблю тебя! ❤️
    <div class="sub">💖 Ты самый лучший! 💖</div>
</div>

<!-- Верхняя панель -->
<div class="pixel-header">
    <div class="event-badge">⚡ PIXEL POINT ❤️</div>
    <div class="pixel-stats" id="pixel-stats">🎨 Пикселей: 0</div>
    <button class="clear-btn" id="btn-clear-pixel">🗑️ Очистить всё</button>
</div>

<!-- Холст -->
<div class="pixel-canvas-container" id="pixel-canvas-container">
    <canvas id="pixel-canvas"></canvas>
</div>

<!-- Палитра цветов -->
<div class="pixel-controls">
    <div class="pixel-color-palette" id="pixel-color-palette">
        <div class="pixel-color-btn" style="background:#d63384" data-color="#d63384"></div>
        <div class="pixel-color-btn" style="background:#ff0000" data-color="#ff0000"></div>
        <div class="pixel-color-btn" style="background:#ff6600" data-color="#ff6600"></div>
        <div class="pixel-color-btn" style="background:#ffcc00" data-color="#ffcc00"></div>
        <div class="pixel-color-btn" style="background:#00cc00" data-color="#00cc00"></div>
        <div class="pixel-color-btn" style="background:#0099ff" data-color="#0099ff"></div>
        <div class="pixel-color-btn" style="background:#6600cc" data-color="#6600cc"></div>
        <div class="pixel-color-btn" style="background:#ffffff" data-color="#ffffff"></div>
        <div class="pixel-color-btn" style="background:#000000" data-color="#000000"></div>
    </div>
</div>

<script>
    // ==================== FIREBASE ====================
    const firebaseConfig = {
        apiKey: "AIzaSyA-g4MW0wXtXIdRd04-OdVPY5w-zIFb2b0",
        authDomain: "walk-canvas-project.firebaseapp.com",
        databaseURL: "https://walk-canvas-project-default-rtdb.firebaseio.com",
        projectId: "walk-canvas-project",
        storageBucket: "walk-canvas-project.firebasestorage.app",
        messagingSenderId: "609880698980",
        appId: "1:609880698980:web:311320d1256c2c8365ef71"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const pixelRef = db.ref('pixel_love_forever');
    const onlineRef = db.ref('online_love');

    // ==================== ОНЛАЙН ====================
    let myId = 'u_' + Date.now() + '_' + Math.random();
    let onlineFlag = false;
    const onlineSpan = document.getElementById('onlineCount');
    db.ref('.info/connected').on('value', snap => {
        if (snap.val() === true && !onlineFlag) {
            onlineRef.child(myId).set(true);
            onlineRef.child(myId).onDisconnect().remove();
            onlineFlag = true;
        }
    });
    onlineRef.on('value', snap => {
        let cnt = snap.numChildren();
        onlineSpan.innerText = cnt === 0 ? 1 : cnt;
    });

    // ==================== ХОЛСТ ====================
    const PW = 1024, PH = 1024, DS = 2;
    const canvas = document.getElementById('pixel-canvas');
    let ctx = canvas.getContext('2d');
    let grid = {};
    let currentColor = '#d63384';

    // ==================== ВСПЛЫВАЮЩАЯ ТАБЛИЧКА ====================
    const lovePopup = document.getElementById('lovePopup');
    let popupTimeout = null;

    function showLovePopup() {
        // Показываем табличку
        lovePopup.style.display = 'block';
        lovePopup.style.animation = 'popIn 0.3s ease';

        // Убираем старый таймер
        if (popupTimeout) clearTimeout(popupTimeout);

        // Через 2 секунды скрываем с анимацией
        popupTimeout = setTimeout(() => {
            lovePopup.style.animation = 'popOut 0.3s ease';
            setTimeout(() => {
                lovePopup.style.display = 'none';
                lovePopup.style.animation = 'popIn 0.3s ease';
            }, 300);
        }, 2000);
    }

    // ==================== ИНИЦИАЛИЗАЦИЯ ====================
    function initSize() {
        canvas.width = PW * DS;
        canvas.height = PH * DS;
        canvas.style.width = (PW * DS) + 'px';
        canvas.style.height = (PH * DS) + 'px';
    }

    function render() {
        if (!ctx) return;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (const key in grid) {
            const color = grid[key];
            if (color && color !== '#ffffff') {
                const [x, y] = key.split('_').map(Number);
                ctx.fillStyle = color;
                ctx.fillRect(x * DS, y * DS, DS, DS);
            }
        }
        const filled = Object.keys(grid).length;
        document.getElementById('pixel-stats').innerHTML = `🎨 Пикселей: ${filled} / 1,048,576`;
    }

    function loadData() {
        pixelRef.once('value', snap => {
            grid = snap.val() || {};
            render();
        });
        pixelRef.on('value', snap => {
            grid = snap.val() || {};
            render();
        });
    }

    function setPixel(x, y) {
        const key = `${x}_${y}`;
        if (grid[key] === currentColor) return;
        grid[key] = currentColor;
        pixelRef.set(grid);
        // Показываем всплывающую табличку при каждом нажатии
        showLovePopup();
        // Мгновенная отрисовка
        ctx.fillStyle = currentColor;
        ctx.fillRect(x * DS, y * DS, DS, DS);
        const filled = Object.keys(grid).length;
        document.getElementById('pixel-stats').innerHTML = `🎨 Пикселей: ${filled} / 1,048,576`;
    }

    function getCoords(e) {
        const rect = canvas.getBoundingClientRect();
        const sx = canvas.width / rect.width;
        const sy = canvas.height / rect.height;
        let cx = e.clientX || (e.touches?.[0]?.clientX || 0);
        let cy = e.clientY || (e.touches?.[0]?.clientY || 0);
        let canX = (cx - rect.left) * sx;
        let canY = (cy - rect.top) * sy;
        return { x: Math.floor(canX / DS), y: Math.floor(canY / DS) };
    }

    function onClick(e) {
        const { x, y } = getCoords(e);
        if (x >= 0 && x < PW && y >= 0 && y < PH) {
            setPixel(x, y);
        }
    }

    // ==================== ПАЛИТРА ====================
    document.querySelectorAll('.pixel-color-btn').forEach(btn => {
        btn.onclick = () => {
            document.querySelectorAll('.pixel-color-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentColor = btn.dataset.color;
        };
    });
    document.querySelector('.pixel-color-btn').classList.add('active');

    // ==================== ОЧИСТКА ====================
    document.getElementById('btn-clear-pixel').onclick = () => {
        if (confirm("Очистить ВЕСЬ холст 1024x1024?")) {
            grid = {};
            pixelRef.set(grid);
        }
    };

    // ==================== ЗАПУСК ====================
    canvas.addEventListener('click', onClick);
    canvas.addEventListener('touchstart', e => {
        e.preventDefault();
        onClick(e);
    }, { passive: false });

    initSize();
    loadData();

    console.log("❤️ Pixel Point готов! Каждый пиксель = 'Миша, я люблю тебя!' ❤️");
</script>

</body>
</html>
